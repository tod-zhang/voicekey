name: Windows test build

# 功能分支推送后自动打 Windows 测试安装包（不签名更新包、不发布 Release），在 Actions 运行页的 Artifacts 下载
on:
  push:
    branches: ['feat/**']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc-test

      - name: Build
        working-directory: app
        run: |
          npm ci
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceKey-test-${{ github.run_number }}-x64-setup
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
